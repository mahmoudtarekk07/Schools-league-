<style>

<style>

<div id="shell"><div id="scr"><main class="w" id="app"></main><footer class="w">Demo with invented schools, players and scores. No backend, no database.</footer></div><button id="fab" onclick="navigator.vibrate&&navigator.vibrate(15);play()"></button><nav id="bn" aria-label="Main"></nav><div id="splash"><div class="lg">⚽</div>Madaris League<small>Every school. One league.</small></div></div>
<script>
const A=[{n:"New Cairo",c:"#2563EB",s:["Nile Valley Intl","Cairo Future IB","Rehab Language","Alpha British","Bright Minds","Capital Stars"]},
{n:"Heliopolis",c:"#E2492F",s:["Heliopolis National","Korba Language","Ahram Model","Merghany School","Roxy Language","Safir Academy"]},
{n:"Nasr City",c:"#7C3AED",s:["Zahra School","Abbas Language","Tayaran Model","Makram Intl","Rabaa Academy","Hay 7 National"]},
{n:"Shorouk",c:"#0D9488",s:["Shorouk Language","Green Valley","Horizon Intl","Sunrise Academy","Orchid School","Falcon Prep"]}];
const SOON=["Maadi","6th October"],ST={primary:"Primary",prep:"Preparatory",secondary:"Secondary"};
const FN=["Omar","Youssef","Ahmed","Karim","Mostafa","Adam","Ziad","Hamza","Tarek","Ali","Malek","Seif","Yassin","Hady","Moaz","Fares","Bassel","Nour"],LN=["Hassan","Salah","Fathy","Nabil","Samir","Gamal","Farouk","Adel","Reda","Emad"];
const st={a:null,stage:"prep",tab:"table",sel:null,played:{},watch:{}},cache={};
const pl=(a,i,j,o)=>FN[(a*7+i*3+j+o)%18]+" "+LN[(i+j*3+a+o)%10];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function build(a,sg){const k=a+sg;if(cache[k])return cache[k];const r=rng(a*97+sg.length*13+5),ms=[];let t=[0,1,2,3,4,5];
for(let rd=1;rd<=5;rd++){for(let i=0;i<3;i++){const h=t[i],v=t[5-i],hs=Math.floor(r()*r()*5+r()*1.5),as=Math.floor(r()*r()*4+r()*1.4),sc={};
[[h,hs],[v,as]].forEach(([m,n])=>{for(let q=0;q<n;q++){const key=m+"-"+Math.floor(r()*r()*5);sc[key]=(sc[key]||0)+1}});ms.push({rd,h,a:v,hs,as,sc})}
t=[t[0],t[5],t[1],t[2],t[3],t[4]]}return cache[k]=ms}
const POS=["ST","RW","CAM","CM","CB"],NO=[9,7,10,8,5],AT=["Pace","Shooting","Passing","Dribbling","Defending","Stamina"],mn=(i,j,q,rd)=>(i*37+j*19+q*29+rd*13)%89+1;
function calc(){const a=st.a,o=Object.keys(ST).indexOf(st.stage)*5,ms=build(a,st.stage),n=st.played[a+st.stage]??3,
T=A[a].s.map((_,i)=>({i,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,f:[]})),P=[];
A[a].s.forEach((_,i)=>{for(let j=0;j<5;j++)P.push({a,i,j,st:st.stage,name:pl(a,i,j,o),g:0,as:0,gm:Array(n).fill(0),ev:[]})});
ms.filter(m=>m.rd<=n).forEach(m=>{[[m.h,m.hs,m.as],[m.a,m.as,m.hs]].forEach(([i,f,g])=>{const x=T[i],q=f>g?"W":f<g?"L":"D";x.p++;x.gf+=f;x.ga+=g;x[q.toLowerCase()]++;x.pts+=q=="W"?3:q=="D"?1:0;x.f.push(q)});
for(const k in m.sc){const[i,j]=k.split("-").map(Number);for(let q=0;q<m.sc[k];q++){const p=P[i*5+j];p.g++;p.gm[m.rd-1]++;p.ev.push({rd:m.rd,min:mn(i,j,q,m.rd)});P[i*5+(j+1+q%4)%5].as++}}});
P.forEach(p=>{const t=T[p.i],h=(a*7+p.i*3+p.j*5+o)%7;p.apps=t.p;p.rating=Math.min(9.9,+(6+.45*p.g+.25*p.as+.08*t.w+h/10).toFixed(1));
p.at=AT.map((_,k)=>{let v=55+(a*13+p.i*7+p.j*11+o*3+k*17)%25;if(k==1)v+=p.g*4+(p.j<3?6:-8);if(k==2)v+=p.as*4;if(k==4)v+=p.j>2?14:-6;return Math.max(35,Math.min(99,v))});
p.ovr=Math.round(p.at.reduce((s,x)=>s+x,0)/6+(p.rating-6)*4);p.tier=p.ovr>=74?"gold":p.ovr>=67?"silver":"bronze";p.no=NO[p.j];p.pos=POS[p.j];p.age=[9,12,15][o/5]+(a+p.i+p.j)%3;p.sch=A[a].s[p.i]});
T.sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf);
return{T,P,pr:P.slice().sort((x,y)=>y.g-x.g||y.as-x.as||y.rating-x.rating),n,o,ms,tot:ms.filter(m=>m.rd<=n).reduce((s,m)=>s+m.hs+m.as,0)}}
function getP(a,sg,i,j){const v=[st.a,st.stage];st.a=a;st.stage=sg;const c=calc();st.a=v[0];st.stage=v[1];return c.P[i*5+j]}
const shell=document.getElementById("shell"),scr=document.getElementById("scr");
function nav(){const sa=st.a!=null,n=sa?(st.played[st.a+st.stage]??3):5,w=Object.keys(st.watch).length,it=[["home","🏟","Areas"],["table","📊","Table"],["players","👥","Players"],["scorers","🥇","Boot"],["scout","⭐","Scout"]];
document.getElementById("bn").innerHTML=it.map(([k,e,l])=>`<button class="${(k=="home"?!sa:sa&&st.tab==k)?"on":""}" onclick="gt('${k}')"><span>${e}</span>${l}${k=="scout"&&w?`<i>${w}</i>`:""}</button>`).join("");
const f=document.getElementById("fab");f.style.display=sa&&n<5&&(st.tab=="table"||st.tab=="matches")?"block":"none";f.textContent="▶ Play matchday "+(n+1)}

const go=f=>document.startViewTransition?document.startViewTransition(f):f();
function openArea(i){go(()=>{st.a=i;st.sel=null;st.tab="table";st.last=i;render();scr.scrollTop=0})}
function home(){go(()=>{st.last=st.a??st.last;st.a=null;render();scr.scrollTop=0})}
function count(el){const t=+el.dataset.n;let v=0;const id=setInterval(()=>{v+=Math.ceil(t/25);if(v>=t){v=t;clearInterval(id)}el.textContent=v},35)}
function renderHome(){const sv=st.a,all=[];let g=0,sc=0;A.forEach((_,i)=>{st.a=i;const c=calc();g+=c.tot;all.push(c)});st.a=sv;
return`<section class="hero"><div class="ball">⚽</div><div class="shadow"></div><h1>Every school.<br>One <em>league</em>.</h1><p>Pick your area. Follow your school's football season from kickoff to the city final.</p>
<div class="stats"><div><b data-n="${A.length*6}">0</b><span>schools playing</span></div><div><b data-n="${A.length*3}">0</b><span>teams per area</span></div><div><b data-n="${g}">0</b><span>goals this season</span></div></div></section>
${mq(all)}<div class="tiles">${A.map((a,i)=>`<button class="tile" style="--c:${a.c}" onclick="openArea(${i})" onmousemove="tilt(event,this)" onmouseleave="this.style.setProperty('--rx','0deg');this.style.setProperty('--ry','0deg')"><span class="live"><i></i>LIVE</span><div><h2>${a.n}</h2><div style="margin:6px 0 10px;opacity:.9">${a.s.length} schools · matchday ${all[i].n}/5</div><small>Leader: ${a.s[all[i].T[0].i]}</small></div></button>`).join("")}
${SOON.map(n=>`<div class="tile lock"><span class="live" style="background:#fff9">Soon</span><div><h2>${n}</h2><small>Opens next season</small></div></div>`).join("")}</div>`}
function tilt(e,el){const r=el.getBoundingClientRect();el.style.setProperty("--ry",((e.clientX-r.left)/r.width-.5)*14+"deg");el.style.setProperty("--rx",(.5-(e.clientY-r.top)/r.height)*14+"deg")}
st.sort="g";st.q="";
const av=p=>`<svg viewBox="0 0 80 80" class="av"><circle cx="40" cy="40" r="40" fill="${A[p.a].c}"/><circle cx="40" cy="30" r="12" fill="#F2C6A0"/><path d="M10 80c2-20 16-28 30-28s28 8 30 28z" fill="#fff"/><text x="40" y="72" text-anchor="middle" font-size="15" font-weight="900" fill="${A[p.a].c}">${p.no}</text></svg>`;
const card=(p,k=1)=>`<div class="fc ${p.tier}" ${k?`onclick="showP(${p.i},${p.j},${p.a},'${p.st}')"`:""}><div class="o1"><b>${p.ovr}</b><span>${p.pos}</span></div>${av(p)}<div class="nm">${p.name}</div><div class="s2"><span><b>${p.g}</b> G</span><span><b>${p.as}</b> A</span><span><b>${p.rating}</b> R</span></div></div>`;
const mq=all=>{const s=all.map((c,i)=>`<span>⚽ ${A[i].n}: <b>${c.pr[0].name}</b> ${c.pr[0].g} goals</span>`).join("");return`<div class="mq"><div>${s}${s}</div></div>`};
const radar=p=>{const pt=(k,v)=>{const g=(-90+60*k)*Math.PI/180;return[100+v*.8*Math.cos(g),100+v*.8*Math.sin(g)]},ring=v=>AT.map((_,k)=>pt(k,v).join(",")).join(" ");
return`<svg viewBox="-30 -5 260 210" class="rd">${[40,70,100].map(v=>`<polygon points="${ring(v)}" fill="none" stroke="var(--line)"/>`).join("")}<polygon points="${p.at.map((v,k)=>pt(k,v).join(",")).join(" ")}" fill="${A[p.a].c}" fill-opacity=".45" stroke="${A[p.a].c}" stroke-width="2" style="transform-origin:100px 100px;animation:grow .9s cubic-bezier(.2,.9,.3,1.2) both"/>${AT.map((t,k)=>{const[x,y]=pt(k,120);return`<text x="${x}" y="${y}" font-size="9" text-anchor="middle" dominant-baseline="middle" fill="var(--mut)">${t} ${p.at[k]}</text>`}).join("")}</svg>`};
const pgrid=c=>{const q=(st.q||"").toLowerCase(),k=st.sort;return`<div class="cg">${c.P.filter(p=>p.name.toLowerCase().includes(q)||p.sch.toLowerCase().includes(q)).sort((x,y)=>(y[k]-x[k])||y.rating-x.rating).map(p=>card(p)).join("")||'<p class="mut">No players match. Try another name or school.</p>'}</div>`};
function tw(a,sg,i,j,el){navigator.vibrate&&navigator.vibrate(15);const k=a+sg+i+j;st.watch[k]?delete st.watch[k]:st.watch[k]={a,sg,i,j};if(el)el.textContent=st.watch[k]?"★ On scout list":"☆ Add to scout list";render()}
function showP(i,j,a=st.a,sg=st.stage){const p=getP(a,sg,i,j),k=a+sg+i+j,o=document.createElement("div");o.className="ov";o.onclick=e=>{if(e.target==o)o.remove()};
o.innerHTML=`<div class="card pm" role="dialog" aria-label="${p.name}"><button class="x" aria-label="Close" onclick="this.closest('.ov').remove()">✕</button>${card(p,0)}<div><h2 style="margin:0">${p.name}</h2><p class="mut">${p.sch} · ${A[a].n} · ${ST[sg]} · age ${p.age}</p><div class="kp"><div><b>${p.g}</b>Goals</div><div><b>${p.as}</b>Assists</div><div><b>${p.apps}</b>Matches</div><div><b>${p.rating}</b>Rating</div></div>${radar(p)}<b>Goals by matchday</b><div class="gb">${p.gm.map((g,r)=>`<div>${g}<i style="height:${g*22+4}px"></i><small>MD${r+1}</small></div>`).join("")}</div><b>Goal log</b><div class="mut">${p.ev.length?p.ev.map(e=>`⚽ MD${e.rd} · ${e.min}'`).join("  ·  "):"No goals yet this season."}</div><button class="go" style="margin:14px 0 0" onclick="tw(${a},'${sg}',${i},${j},this)">${st.watch[k]?"★ On scout list":"☆ Add to scout list"}</button></div></div>`;shell.appendChild(o)}
function swipe(o){const c=o.firstElementChild;let y0=null;c.addEventListener("touchstart",e=>{if(c.scrollTop<=0)y0=e.touches[0].clientY},{passive:true});c.addEventListener("touchmove",e=>{if(y0!=null){const d=e.touches[0].clientY-y0;if(d>0)c.style.transform="translateY("+d+"px)"}},{passive:true});c.addEventListener("touchend",e=>{if(y0==null)return;const d=e.changedTouches[0].clientY-y0;y0=null;if(d>90)o.remove();else c.style.transform=""})}
document.addEventListener("keydown",e=>{if(e.key=="Escape")document.querySelector(".pm")?.closest(".ov").remove()});
function render(){nav();const app=document.getElementById("app");if(st.a==null){app.innerHTML=renderHome();app.querySelectorAll("[data-n]").forEach(count);return}
const a=A[st.a],c=calc(),tabs={table:"League table",players:"Players",scorers:"Golden Boot",matches:"Results",scout:"Scout list ("+Object.keys(st.watch).length+")"};
const bar=`<div class="bar">${Object.entries(ST).map(([k,v])=>`<button class="chip ${st.stage==k?"on":""}" onclick="st.stage='${k}';st.sel=null;render()">${v}</button>`).join("")}<button class="go" ${c.n>=5?"disabled":""} onclick="play()">${c.n>=5?"Season complete 🏆":"Play matchday "+(c.n+1)}</button></div>
<div class="tb" style="margin-bottom:14px">${Object.entries(tabs).map(([k,v])=>`<button class="chip ${st.tab==k?"on":""}" onclick="st.tab='${k}';render()">${v}</button>`).join("")}</div>`;
let h="";
if(st.tab=="table"){const b=c.P.filter(p=>p.gm[c.n-1]>0).sort((x,y)=>y.gm[c.n-1]-x.gm[c.n-1]||y.rating-x.rating)[0];
h=(b?`<button class="potm" onclick="showP(${b.i},${b.j})">⭐ Player of matchday ${c.n}: <b>${b.name}</b> (${b.sch}) · ${b.gm[c.n-1]} goal${b.gm[c.n-1]>1?"s":""}. Tap for profile.</button>`:"")+`<div class="box"><table><thead><tr><th>#</th><th>School</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Form</th><th>Pts</th></tr></thead><tbody>${c.T.map((x,r)=>`<tr data-i="${x.i}" class="${r<2?"up":r>3?"dn":""}" onclick="st.sel=${x.i};render();document.getElementById('team').scrollIntoView({behavior:'smooth',block:'start'})"><td>${r+1}</td><td>${a.s[x.i]}</td><td>${x.p}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gf-x.ga>0?"+":""}${x.gf-x.ga}</td><td>${x.f.slice(-5).map(f=>`<span class="f ${f}">${f}</span>`).join("")}</td><td class="pts">${x.pts}</td></tr>`).join("")}</tbody></table></div><p class="mut">Green: top 2 reach the city final. Red: bottom 2 face a playoff. Tap a school to see its squad cards.</p><div id="team">${st.sel!=null?team(c):""}</div>`}
if(st.tab=="players")h=`<div class="bar" style="margin-top:0">${[["g","Goals"],["as","Assists"],["rating","Rating"]].map(([k,v])=>`<button class="chip ${st.sort==k?"on":""}" onclick="st.sort='${k}';render()">Sort: ${v}</button>`).join("")}<input class="srch" placeholder="Search player or school" aria-label="Search players" value="${st.q}" oninput="st.q=this.value;document.getElementById('pg').innerHTML=pgrid(calc())"></div><div id="pg">${pgrid(c)}</div>`;
if(st.tab=="scorers"){const m=c.pr[0].g||1;h=`<div class="box" style="--c:${a.c}">${c.pr.slice(0,8).map((p,r)=>`<div class="sc"><b>${r+1}</b><div><a href="#" style="color:inherit;font-weight:700;text-decoration:none" onclick="showP(${p.i},${p.j});return false">${p.name}</a><div class="mut">${p.sch} · ${p.as} assists</div></div><div class="t"><i data-w="${p.g/m*100}"></i></div><b>${p.g}</b></div>`).join("")}</div><p class="mut">Tap a name to open the player profile.</p>`}
if(st.tab=="matches"){const ev=m=>Object.keys(m.sc).flatMap(k=>{const[i,j]=k.split("-").map(Number);return Array.from({length:m.sc[k]},(_,q)=>({i,j,t:mn(i,j,q,m.rd)}))}).sort((x,y)=>x.t-y.t).map(e=>`<a href="#" onclick="showP(${e.i},${e.j});return false">${pl(st.a,e.i,e.j,c.o)} ${e.t}'</a>`).join(" · ")||"No goals";
h=[...Array(c.n)].map((_,i)=>c.n-i).map(rd=>`<div class="card"><b>Matchday ${rd}</b>${c.ms.filter(m=>m.rd==rd).map(m=>`<div class="mr"><span>${a.s[m.h]}</span><b>${m.hs} – ${m.as}</b><span style="text-align:end">${a.s[m.a]}</span></div><div class="hl">⚽ ${ev(m)}</div>`).join("")}</div>`).join("")}
if(st.tab=="scout"){const w=Object.values(st.watch);h=w.length?`<p class="mut">Players you starred, across all areas. In the real app, club scouts would see this list with match video.</p><div class="cg">${w.map(x=>card(getP(x.a,x.sg,x.i,x.j))).join("")}</div>`:`<div class="card"><b>Your scout list is empty</b><p class="mut">Open any player card and tap “Add to scout list”.</p></div>`}
app.innerHTML=`<button class="back" onclick="home()">← All areas</button><div class="ah" style="--c:${a.c}"><h1>${a.n} League</h1><p>${ST[st.stage]} football · ${a.s.length} schools · 30 players tracked · ${c.tot} goals so far</p></div>${bar}${h}`;
requestAnimationFrame(()=>requestAnimationFrame(()=>app.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%")))}
function team(c){const i=st.sel,x=c.T.find(t=>t.i==i),r=c.T.indexOf(x)+1,a=A[st.a];
return`<div class="card" style="border-top:6px solid ${a.c}"><h2 style="margin:0">${a.s[i]}</h2><p class="mut">Position ${r} of 6 · ${x.pts} pts · ${x.w}W ${x.d}D ${x.l}L · ${x.gf} scored, ${x.ga} conceded · ${r<=2?"On track for the city final.":r>4?"In the playoff zone and needs wins.":"Mid-table and still in the race."}</p><div class="cg">${c.P.filter(p=>p.i==i).map(p=>card(p)).join("")}</div></div>`}
function play(){const c=calc();if(c.n>=5)return;const a=A[st.a],ms=c.ms.filter(m=>m.rd==c.n+1),o=document.createElement("div");o.className="ov";
o.innerHTML=`<div class="card"><b>Matchday ${c.n+1} · full time</b>${ms.map(m=>`<div class="mr"><span>${a.s[m.h]}</span><b><span data-t="${m.hs}">0</span> – <span data-t="${m.as}">0</span></b><span style="text-align:end">${a.s[m.a]}</span></div>`).join("")}<p class="mut">Updating the table…</p></div>`;shell.appendChild(o);
o.querySelectorAll("[data-t]").forEach(e=>{let v=0;const t=+e.dataset.t;if(t)setTimeout(function s(){v++;e.textContent=v;if(v<t)setTimeout(s,450)},500)});
setTimeout(()=>{const old={};document.querySelectorAll("tr[data-i]").forEach(r=>old[r.dataset.i]=r.getBoundingClientRect().top);
st.played[st.a+st.stage]=c.n+1;o.remove();render();
document.querySelectorAll("tr[data-i]").forEach(r=>{const d=old[r.dataset.i]-r.getBoundingClientRect().top;r.animate([{transform:`translateY(${d}px)`},{transform:"none"}],{duration:800,easing:"cubic-bezier(.2,.8,.2,1)"});r.querySelector(".pts").classList.add("flash")})},2600)}
render();setTimeout(()=>{splash.classList.add('out');setTimeout(()=>splash.remove(),600)},1400);
</script></body></html>
